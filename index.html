<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Archive Explorer</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
    <h1>Archive Explorer</h1>
    <p>Explorer des versions archivées du web</p>
</header>

<section class="search-box">
    <input id="urlInput" placeholder="https://example.com">
    <button onclick="loadArchive()">Rechercher</button>
</section>

<section class="stats">
    <div id="info">Aucune recherche</div>
</section>

<section class="timeline">
    <h2>Chronologie</h2>
    <div id="years"></div>
</section>

<section class="calendar">
    <h2>Calendrier</h2>
    <div id="calendar"></div>
</section>

<section class="viewer">
    <h2>Aperçu</h2>
    <div id="selectedDate">Aucune archive sélectionnée</div>
    <iframe id="frame"></iframe>
</section>

<script src="script.js"></script>
</body>
</html>
